
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-POP Karaoke Official Player</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-black: #030303;
            --bar-bg: #1d1d1d;
            --text-white: #ffffff;
            --text-gray: #aaa;
            --accent-red: #ff0000;
            --card-bg: #181818;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            padding-bottom: 110px;
        }

        header {
            position: sticky;
            top: 0;
            background-color: rgba(3, 3, 3, 0.95);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            z-index: 100;
        }

        header i {
            color: var(--accent-red);
            font-size: 28px;
            margin-right: 12px;
        }

        header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .container {
            padding: 20px 30px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .song-card {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .song-card:hover {
            background-color: #282828;
            transform: translateY(-5px);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            margin-bottom: 12px;
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 4px;
        }

        .song-card:hover .play-overlay {
            opacity: 1;
        }

        .play-overlay i {
            font-size: 30px;
            color: white;
        }

        .song-info .title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .song-info .artist {
            font-size: 12px;
            color: var(--text-gray);
        }

        /* Bottom Player Bar */
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 90px;
            background-color: var(--bar-bg);
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .now-playing {
            display: flex;
            align-items: center;
            width: 30%;
        }

        .now-playing img {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            margin-right: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .player-info .p-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .player-info .p-artist {
            font-size: 12px;
            color: var(--text-gray);
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .control-btns {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 8px;
        }

        .control-btns i {
            font-size: 18px;
            cursor: pointer;
            color: #ddd;
        }

        .control-btns i:hover {
            color: white;
        }

        .main-play-btn {
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            cursor: pointer;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--text-gray);
        }

        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background-color: #3e3e3e;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .progress-filled {
            width: 30%;
            height: 100%;
            background-color: var(--accent-red);
            border-radius: 2px;
        }

        #youtube-player {
            display: none;
        }

        @media (max-width: 768px) {
            .now-playing { width: 40%; }
            .player-controls { width: 50%; }
            .extra-controls { display: none; }
        }
    </style>
</head>
<body>

<header>
    <i class="fa-brands fa-youtube"></i>
    <h2>J-POP Karaoke Official</h2>
</header>

<div class="container">
    <div class="section-title">최신 업로드</div>
    <div class="song-grid" id="song-grid">
        <!-- JS generates content here -->
    </div>
</div>

<footer>
    <div class="now-playing">
        <img id="current-thumb" src="https://via.placeholder.com/150" alt="thumb">
        <div class="player-info">
            <div class="p-title" id="current-title">곡을 선택해주세요</div>
            <div class="p-artist" id="current-artist">J-POP Official</div>
        </div>
    </div>

    <div class="player-controls">
        <div class="control-btns">
            <i class="fa-solid fa-shuffle"></i>
            <i class="fa-solid fa-backward-step"></i>
            <div class="main-play-btn" onclick="togglePlay()">
                <i id="play-icon" class="fa-solid fa-play"></i>
            </div>
            <i class="fa-solid fa-forward-step"></i>
            <i class="fa-solid fa-repeat"></i>
        </div>
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="progress-bar">
                <div class="progress-filled" id="progress-line" style="width: 0%"></div>
            </div>
            <span id="total-time">0:00</span>
        </div>
    </div>

    <div class="extra-controls" style="width: 30%; text-align: right;">
        <i class="fa-solid fa-volume-high" style="margin-right: 15px; cursor: pointer;"></i>
        <i class="fa-solid fa-list-ul" style="cursor: pointer;"></i>
    </div>
</footer>

<div id="youtube-player"></div>

<script>
    // 채널의 실제 영상 ID 리스트 (video_id 교체 가능)
    const songs = [
        { id: 'hST91rxeTOw', title: '노래방 인기곡 메들리 2024', artist: 'J-POP Karaoke Official' },
        { id: 'O7L-tU4U6mI', title: 'Ado - 신시대 (Karaoke)', artist: 'J-POP Karaoke Official' },
        { id: '0_X8L_X-YyE', title: 'Official髭男dism - Pretender', artist: 'J-POP Karaoke Official' },
        { id: '60ItHLz5WEA', title: '인기 J-POP 컬렉션', artist: 'J-POP Karaoke Official' }
    ];

    let player;
    let isPlaying = false;
    let timer;

    // YouTube API Load
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-player', {
            height: '0',
            width: '0',
            videoId: songs[0].id,
            events: {
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.PLAYING) {
            isPlaying = true;
            document.getElementById('play-icon').className = 'fa-solid fa-pause';
            startTimer();
        } else {
            isPlaying = false;
            document.getElementById('play-icon').className = 'fa-solid fa-play';
            clearInterval(timer);
        }
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            const current = player.getCurrentTime();
            const total = player.getDuration();
            const pct = (current / total) * 100;
            
            document.getElementById('progress-line').style.width = pct + '%';
            document.getElementById('current-time').innerText = formatTime(current);
            document.getElementById('total-time').innerText = formatTime(total);
        }, 1000);
    }

    function formatTime(time) {
        if(!time) return "0:00";
        const min = Math.floor(time / 60);
        const sec = Math.floor(time % 60);
        return min + ":" + (sec < 10 ? '0' + sec : sec);
    }

    // Grid Generation
    const grid = document.getElementById('song-grid');
    songs.forEach(song => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.onclick = () => playSong(song);
        card.innerHTML = `
            <div class="thumbnail-container">
                <img class="thumbnail" src="https://img.youtube.com/vi/${song.id}/mqdefault.jpg">
                <div class="play-overlay"><i class="fa-solid fa-play"></i></div>
            </div>
            <div class="song-info">
                <div class="title">${song.title}</div>
                <div class="artist">${song.artist}</div>
            </div>
        `;
        grid.appendChild(card);
    });

    function playSong(song) {
        document.getElementById('current-thumb').src = `https://img.youtube.com/vi/${song.id}/mqdefault.jpg`;
        document.getElementById('current-title').innerText = song.title;
        document.getElementById('current-artist').innerText = song.artist;
        
        player.loadVideoById(song.id);
        player.playVideo();
    }

    function togglePlay() {
        if (isPlaying) {
            player.pauseVideo();
        } else {
            player.playVideo();
        }
    }
</script>

</body>
</html>
